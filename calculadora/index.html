<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/input.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>calculadora</title>
</head>

<body class="theme-1">
  <section>
    <!-- header -->
    <header>
      <div class="flex justify-between items-center w-110">
        <p class="font-bold text-white text-xl">calc</p>
        <div class="flex gap-6 w-auto">
          <span class="font-bold text-white uppercase text-[0.625rem] tracking-wider self-center mt-1">Theme</span>
          <div class="flex flex-col w-fit h-auto -mt-2">
            <div class="flex justify-evenly text-white text-[0.688rem] font-medium">
              <span data-number-theme></span>
              <span data-number-theme></span>
              <span data-number-theme></span>
            </div>
            <button class="bg-navy900 h-5 w-14 rounded-full relative cursor-pointer" data-box-choose>
              <div class="top-1 left-1 absolute rounded-full w-3 h-3 bg-red600 t1" data-choose></div>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- display -->
    <div class="flex justify-between items-center bg-navy950 w-full h-24 rounded-md mt-6" data-display>
      <span data-operation-display class="text-white ml-3"></span>
      <span data-digit-display class="text-white text-5xl mr-6 font-bold"></span>
    </div>
    <div class="bg-navy900 w-full h-auto rounded-md mt-4 p-6 main">
      <div class="grid grid-cols-4 gap-6 *:flex *:items-center *:justify-center *:cursor-pointer">
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-value="7">
          <span>7</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-value="8">
          <span>8</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-value="9">
          <span>9</span>
        </button>
        <button type="button" class="btnDel buttonDelResetHover" data-btn-modifiers>
          <span>del</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-value="4">
          <span>4</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-value="5">
          <span>5</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-value="6">
          <span>6</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-operator="+">
          <span>+</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-value="1">
          <span>1</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-value="2">
          <span>2</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-value="3">
          <span>3</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-operator="-">
          <span>-</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-value=",">
          <span>.</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-value="0">
          <span>0</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-operator="/">
          <span>/</span>
        </button>
        <button type="button" class="buttonKeysCalculator buttonKeysHover" data-operator="x">
          <span>x</span>
        </button>
      </div>
      <div class="flex justify-between mt-6 items-center">
        <button class="uppercase bg-navy700 text-white py-2 px-15 rounded-md font-bold text-2xl boxShadowResetButton btnReset cursor-pointer buttonDelResetHover" data-btn-modifiers>
          <span>reset</span>
        </button>
        <button class="bg-red600 text-white py-2 px-22 rounded-md font-bold text-2xl boxShadowLastButton cursor-pointer btnSinalIgual buttonSinalIgualHover" data-btn-modifiers>
          <span>=</span>
        </button>
      </div>
    </div>
  </section>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
